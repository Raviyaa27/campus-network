[defaults]
inventory              = inventory/hosts.yml
# Ansible opens five connections in parallel by default. These devices are
# emulated and share a small number of virtual CPUs, and five simultaneous CLI
# sessions is enough to make them time out during authentication - a host that
# answers a simple ping will still fail a real task under that load. Two
# connections is a compromise that completes reliably; use --forks 1 when the
# simulator is heavily loaded.
forks                  = 2
roles_path             = roles
host_key_checking      = False
retry_files_enabled    = False
interpreter_python     = auto_silent
stdout_callback        = yaml
# Report every task result, not only changes, so a --check run reads as a
# complete statement about the estate rather than a list of exceptions.
display_skipped_hosts  = True

# The vault password file is excluded by .gitignore. Supplying it here avoids a
# prompt on every run while keeping the password itself out of the repository.
vault_password_file    = vault_pass.txt

[persistent_connection]
# These devices are emulated and their control plane responds in the order of a
# second. The defaults of 30s assume physical hardware and abandon a session
# that is merely slow.
command_timeout = 120
connect_timeout = 120
