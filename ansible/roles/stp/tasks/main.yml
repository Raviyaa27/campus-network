---
# Spanning tree mode and root placement.
#
# Rapid PVST converges in seconds rather than the ~50 seconds of the
# original standard, which matters because the dual homed uplinks depend on
# reconvergence when a link fails.

- name: Set the spanning tree mode
  cisco.ios.ios_config:
    lines:
      - "spanning-tree mode {{ stp_mode }}"

# Only the core pair takes a root role. Every other switch keeps the default
# priority so the root can never move below the core.
- name: Set root priority for the VLANs this switch leads
  cisco.ios.ios_config:
    lines:
      - "spanning-tree vlan {{ stp_root_primary }} root primary"
  when: stp_root_primary is defined

- name: Set backup root priority for the peer's VLANs
  cisco.ios.ios_config:
    lines:
      - "spanning-tree vlan {{ stp_root_secondary }} root secondary"
  when: stp_root_secondary is defined
