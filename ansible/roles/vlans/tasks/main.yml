---
# The VLAN database must exist before any trunk can allow a VLAN or any port
# can be assigned to one, which is why this role runs first in site.yml.

- name: Ensure the intended VLANs are present
  cisco.ios.ios_vlans:
    config: "{{ switch_vlans }}"
    # merged adds and corrects the VLANs listed without removing others.
    # overridden would delete anything not named here, which is the correct
    # behaviour for the rollback playbook but too destructive for site.yml:
    # a VLAN created for an unrelated reason should not vanish because it is
    # absent from these variables.
    state: merged
