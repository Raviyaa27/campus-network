# Switch inventory, grouped by layer.
#
# The group a switch belongs to determines which variables apply to it, so the
# grouping mirrors the three-layer design rather than being an arbitrary
# convenience. Routers are absent by design: they are managed by the Netmiko
# scripts, and the division of responsibility is discussed in the tool
# selection justification.

all:
  children:

    switches:
      children:

        core_switches:
          hosts:
            SW-CORE-1:
              ansible_host: 10.99.99.2
            SW-CORE-2:
              ansible_host: 10.99.99.3

        distribution_switches:
          hosts:
            SW-D-DEIE:
              ansible_host: 10.99.99.11
            SW-D-DCEE:
              ansible_host: 10.99.99.12
            SW-D-DMME:
              ansible_host: 10.99.99.13

        access_switches:
          hosts:
            SW-A-DEIE:
              ansible_host: 10.99.99.21
            SW-A-DCEE:
              ansible_host: 10.99.99.22
            SW-A-DMME:
              ansible_host: 10.99.99.23
            SW-A-DIS:
              ansible_host: 10.99.99.24
