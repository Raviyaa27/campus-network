! R-CORE console bootstrap
!
! Applied by console after "write erase" and reload, before the automation is
! run. This is the minimum required for the automation host to reach the device
! at all: an identity, credentials, an SSH server, and one path back to
! 10.99.99.100.
!
! Netmiko cannot configure a device it cannot reach. A wiped router has no
! address, no user account and no SSH server, so something outside the
! automation has to establish that first. Production networks solve this with
! console servers, zero touch provisioning, or DHCP with TFTP. Here it is done
! by console.
!
! Everything not in this file - the remaining interfaces, their descriptions,
! the OSPF point-to-point network types, the passive interface and the full set
! of advertised networks - is restored by configure_routers.py.
!
hostname R-CORE
no ip domain-lookup
ip domain-name foe.ruh.ac.lk
!
enable secret Campus2026
username admin privilege 15 secret Campus2026
crypto key generate rsa modulus 2048
ip ssh version 2
!
! Loopback0 is the address held in the Netmiko inventory, so it must exist
! before the script runs.
interface Loopback0
 ip address 10.99.0.1 255.255.255.255
!
! One link to the core switch pair, which gives OSPF a path to advertise the
! loopback to the rest of the campus.
interface GigabitEthernet0/2
 ip address 10.255.255.5 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.99.0.1
 network 10.99.0.1 0.0.0.0 area 0
 network 10.255.255.4 0.0.0.3 area 0
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
line vty 0 4
 transport input ssh
 login local
!
end
