! SW-CORE-2 - core Layer 3 switch
! HSRP active for VLAN 30, 40 / STP root for VLAN 30, 40
! Cisco IOSvL2 15.2
!
hostname SW-CORE-2
no ip domain-lookup
ip domain-name foe.ruh.ac.lk
ip routing
!
vtp mode transparent
spanning-tree mode rapid-pvst
spanning-tree vlan 30,40 root primary
spanning-tree vlan 10,20,99 root secondary
!
vlan 10
 name VLAN_DEIE
vlan 20
 name VLAN_DCEE
vlan 30
 name VLAN_DMME
vlan 40
 name VLAN_DIS
vlan 99
 name MGMT
vlan 100
 name NATIVE
!
! Peer link to SW-CORE-1, LACP bundle
interface range GigabitEthernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 100
 switchport trunk allowed vlan 10,20,30,40,99
 channel-group 1 mode active
 no shutdown
!
interface Vlan10
 description DEIE user gateway
 ip address 10.10.10.3 255.255.255.0
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 100
 standby 10 preempt
 no shutdown
!
interface Vlan20
 description DCEE user gateway
 ip address 10.10.20.3 255.255.255.0
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 100
 standby 20 preempt
 no shutdown
!
interface Vlan30
 description DMME user gateway
 ip address 10.10.30.3 255.255.255.0
 standby version 2
 standby 30 ip 10.10.30.1
 standby 30 priority 110
 standby 30 preempt
 no shutdown
!
interface Vlan40
 description DIS server farm gateway
 ip address 10.10.40.3 255.255.255.0
 standby version 2
 standby 40 ip 10.10.40.1
 standby 40 priority 110
 standby 40 preempt
 no shutdown
!
interface Vlan99
 description Management gateway
 ip address 10.99.99.3 255.255.255.0
 standby version 2
 standby 99 ip 10.99.99.1
 standby 99 priority 100
 standby 99 preempt
 no shutdown
!
! Management access - SSH only, no telnet
enable secret Campus2026
username admin privilege 15 secret Campus2026
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
service password-encryption
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
line vty 0 15
 transport input ssh
 login local
 exec-timeout 15 0
!
end
