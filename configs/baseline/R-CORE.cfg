! R-CORE - core router, OSPF area 0, dual-homed to the core switch pair
! Cisco IOSv 15.9(3)M6
!
hostname R-CORE
no ip domain-lookup
ip domain-name foe.ruh.ac.lk
!
interface Loopback0
 description Management loopback
 ip address 10.99.0.1 255.255.255.255
!
interface GigabitEthernet0/1
 description Link to R-EDGE
 ip address 10.255.255.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/2
 description Link to SW-CORE-1
 ip address 10.255.255.5 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
interface GigabitEthernet0/3
 description Link to SW-CORE-2
 ip address 10.255.255.9 255.255.255.252
 ip ospf network point-to-point
 no shutdown
!
router ospf 1
 router-id 10.99.0.1
 passive-interface Loopback0
 network 10.99.0.1 0.0.0.0 area 0
 network 10.255.255.0 0.0.0.3 area 0
 network 10.255.255.4 0.0.0.3 area 0
 network 10.255.255.8 0.0.0.3 area 0
!
enable secret Campus2026
username admin privilege 15 secret Campus2026
ip ssh version 2
service password-encryption
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
line vty 0 4
 transport input ssh
 login local
!
end
